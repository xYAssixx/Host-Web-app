<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<meta http-equiv="X-UA-Compatible" content="IE=7">
	<link rel="stylesheet" href="../assets/css/styles.css">
	<!-- Bootstrap  -->
	 <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
	 <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
	<title>Login page</title>
</head>
<body>
	<main class="d-flex justify-content-center align-items-center vh-100 bg-light">
		<div class="card shadow-sm" style="width: 100%; max-width: 400px;">
			<div class="card-body text-center">
				<img src="../assets/img/logo.png" alt="SchoolEase Logo"
						 class="mb-2 login-img" />
				<h4 class="card-title mb-4">Welcome to NajaH</h4>
				<p class="text-body-tertiary mb-1 fw-light">Please enter your credentials to access the app.</p>
				<form id="login-form" class="needs-validation" novalidate>
					<div class="mb-3 text-start">
						<label for="username" class="form-label">Username</label>
						<input type="text" id="username"
									 class="form-control" placeholder="Enter username" required />
						<div class="invalid-feedback">Please enter your username.</div>
					</div>
					<div class="mb-3 text-start">
						<label for="password" class="form-label">Password</label>
						<input type="password" id="password"
									 class="form-control" placeholder="Enter password" required />
						<div class="invalid-feedback">Please enter your password.</div>
					</div>
					<div id="login-error" class="text-bg-danger top-0 p-2 rounded-1 d-none mb-3 position-absolute" style="left: 15%;"></div>
					<button type="submit" class="btn btn-primary w-100 submit">Login</button>
				</form>
			</div>
		</div>
	</main>

	<script type="module" src="../assets/js/Login.js"></script>
	<!-- Bootstrap -->
	<script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
